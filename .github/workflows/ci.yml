name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [21, 22, 24]
    # The job only reads: checkout, npm ci, and a git diff. No commit or push,
    # so the default token is narrowed to read-only, matching the sibling repos.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # CI runs the suite across the whole supported node range so a
          # boundary regression fails loudly: the engines floor (21, where the
          # `node --test` glob first works), the current LTS (22), and the
          # node24 runtime the action itself ships on (action.yml). The test
          # suite runs on the runner node here; the bundled dist runs on node24
          # in production regardless.
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run all
      # dist/ is the committed ncc bundle that action.yml runs. `npm run all`
      # rebuilds it from the current src, so a non-empty diff here means the
      # bundle was committed without `npm run package` and would ship stale
      # compiled code. The bundle is byte-reproducible under the lockfile-pinned
      # ncc, so this gate fails only on a genuinely stale dist, never on rebuild
      # noise.
      - run: git diff --exit-code dist
